name: Bundle skills

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the bundled .skill files under"
        required: false
        default: "skills-latest"

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bundle each skill as a .skill file
        run: |
          mkdir -p dist
          cd skills
          for dir in */; do
            name="${dir%/}"
            [ -f "$dir/SKILL.md" ] || continue
            zip -rq "../dist/${name}.skill" "$dir" -x '*.DS_Store'
          done
          ls -la ../dist

      - name: Publish release with bundled skills
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'skills-latest' }}
        run: |
          NOTES="Bundled .skill files for each skill in feedly-cti-skills, built from $(git rev-parse --short HEAD)."

          # Move the tag to the current commit so GitHub's auto-generated
          # "Source code" archives match the bundled .skill files.
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.skill \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --notes "$NOTES"
          else
            gh release create "$TAG" dist/*.skill \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "$NOTES"
          fi
